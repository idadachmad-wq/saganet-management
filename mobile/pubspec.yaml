name: saganet_mobile
description: SaGa-Net Workspace — APK offline-first (PSB & pelanggan) dengan sync Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
